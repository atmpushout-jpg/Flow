<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowExecutor — Usage Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e1a; color: #e8ecf4; font-family: -apple-system, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8a93a8; font-size: 13px; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .card { background: #131a2e; border: 1px solid #1e2a45; border-radius: 12px; padding: 20px; }
  .card .label { font-size: 12px; color: #8a93a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .card .value { font-size: 36px; font-weight: 700; color: #00e5ff; }
  .card .value.warn { color: #ff6b6b; }
  .meta { background: #131a2e; border: 1px solid #1e2a45; border-radius: 12px; padding: 16px 20px; font-size: 13px; color: #8a93a8; }
  .meta b { color: #e8ecf4; }
  .refresh { margin-top: 16px; font-size: 12px; color: #5a6378; text-align: center; }
  .live { display: inline-block; width: 8px; height: 8px; background: #00e5a0; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
  <h1><span class="live"></span>FlowExecutor Usage</h1>
  <div class="sub">Live API activity — updates every 30 seconds</div>
  <div class="cards">
    <div class="card"><div class="label">Quotes Served</div><div class="value" id="quotes">–</div></div>
    <div class="card"><div class="label">Errors</div><div class="value warn" id="errors">–</div></div>
  </div>
  <div class="meta" id="meta">Connecting…</div>
  <div class="refresh">Auto-refreshes every 30s · <a href="/api/stats" style="color:#00e5ff">raw JSON</a></div>
<script>
async function load() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/atmpushout-jpg/Flow/main/stats/total.json?t=' + Date.now());
    const d = await r.json();
    document.getElementById('quotes').textContent = d.totalQuotes ?? 0;
    document.getElementById('errors').textContent = '–';
    document.getElementById('meta').innerHTML =
      'Last updated <b>' + new Date(d.lastUpdated).toLocaleString() + '</b><br>' +
      'Running total across all instances · Updated every 5 min';
  } catch(e) {
    document.getElementById('meta').textContent = 'Could not reach stats — retrying…';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
